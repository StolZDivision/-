<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>デイリー家計簿</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0F0F14;
    --card: #1C1C28;
    --card2: #232333;
    --green: #00E5A0;
    --orange: #FF6B35;
    --red: #FF3B5C;
    --text: #E5E5F0;
    --muted: #6B6B8A;
    --border: #2E2E44;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 60px;
  }

  h1 {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 28px;
    margin-top: 8px;
  }

  .date-label {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
    letter-spacing: 0.05em;
  }

  /* ── メーターカード ── */
  .meter-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    width: 100%;
    max-width: 380px;
    padding: 28px 24px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    margin-bottom: 16px;
  }

  .ring-wrap {
    position: relative;
    width: 200px;
    height: 200px;
    margin-bottom: 20px;
  }

  .ring-svg {
    width: 200px;
    height: 200px;
    transform: rotate(-90deg);
  }

  .ring-bg {
    fill: none;
    stroke: var(--border);
    stroke-width: 12;
  }

  .ring-fill {
    fill: none;
    stroke-width: 12;
    stroke-linecap: round;
    transition: stroke-dashoffset 0.6s cubic-bezier(.4,0,.2,1), stroke 0.4s ease;
  }

  .ring-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .ring-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .ring-amount {
    font-family: 'JetBrains Mono', monospace;
    font-size: 36px;
    font-weight: 800;
    line-height: 1;
    transition: color 0.4s ease;
  }

  .ring-unit {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    color: var(--muted);
    margin-top: 4px;
  }

  .stats-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    width: 100%;
  }

  .stat-box {
    background: var(--card2);
    border-radius: 12px;
    padding: 14px 16px;
    border: 1px solid var(--border);
  }

  .stat-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .stat-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 700;
  }

  .stat-unit {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
  }

  /* ── 予算設定 ── */
  .section-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    width: 100%;
    max-width: 380px;
    padding: 20px 20px;
    margin-bottom: 16px;
  }

  .section-title {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .budget-input-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .budget-input {
    flex: 1;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 700;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s;
    width: 100%;
  }

  .budget-input:focus {
    border-color: var(--green);
  }

  .yen-symbol {
    font-family: 'JetBrains Mono', monospace;
    font-size: 20px;
    color: var(--muted);
  }

  .set-btn {
    background: var(--green);
    color: #0F0F14;
    border: none;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 700;
    padding: 11px 18px;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    white-space: nowrap;
  }

  .set-btn:hover { opacity: 0.85; }
  .set-btn:active { transform: scale(0.97); }

  /* ── 支出入力 ── */
  .expense-row {
    display: flex;
    gap: 10px;
    margin-bottom: 14px;
  }

  .expense-input {
    flex: 1;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .expense-input:focus { border-color: var(--orange); }

  .note-input {
    flex: 1;
    background: var(--card2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  .note-input:focus { border-color: var(--orange); }
  .note-input::placeholder { color: var(--muted); }

  .add-btn {
    background: var(--orange);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-family: 'Inter', sans-serif;
    font-size: 22px;
    font-weight: 700;
    width: 46px;
    height: 46px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.2s, transform 0.1s;
    align-self: center;
  }

  .add-btn:hover { opacity: 0.85; }
  .add-btn:active { transform: scale(0.97); }

  /* ── 履歴 ── */
  .history-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .history-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card2);
    border-radius: 10px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    animation: slideIn 0.25s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .history-note {
    font-size: 13px;
    color: var(--muted);
    flex: 1;
  }

  .history-amount {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px;
    font-weight: 700;
    color: var(--orange);
    margin-right: 12px;
  }

  .del-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 4px;
    line-height: 1;
    transition: color 0.2s;
    flex-shrink: 0;
  }

  .del-btn:hover { color: var(--red); }

  .empty-history {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    padding: 12px 0;
  }

  .over-notice {
    font-size: 12px;
    color: var(--red);
    text-align: center;
    margin-top: 10px;
    font-weight: 600;
    letter-spacing: 0.05em;
    animation: pulse 1.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
</style>
</head>
<body>

<h1>デイリー家計簿</h1>

<!-- メーターカード -->
<div class="meter-card">
  <div class="date-label" id="dateLabel"></div>

  <div class="ring-wrap">
    <svg class="ring-svg" viewBox="0 0 200 200">
      <circle class="ring-bg" cx="100" cy="100" r="80"/>
      <circle class="ring-fill" id="ringFill" cx="100" cy="100" r="80"/>
    </svg>
    <div class="ring-center">
      <div class="ring-label">あと使える</div>
      <div class="ring-amount" id="remaining">—</div>
      <div class="ring-unit">円</div>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-box">
      <div class="stat-label">今日の予算</div>
      <div class="stat-value" id="budgetDisp">—<span class="stat-unit"> 円</span></div>
    </div>
    <div class="stat-box">
      <div class="stat-label">使った金額</div>
      <div class="stat-value" id="spentDisp" style="color:var(--orange)">0<span class="stat-unit"> 円</span></div>
    </div>
  </div>

  <div class="over-notice" id="overNotice" style="display:none">⚠️ 予算オーバーです</div>
</div>

<!-- 予算設定 -->
<div class="section-card">
  <div class="section-title">予算を設定</div>
  <div class="budget-input-wrap">
    <span class="yen-symbol">¥</span>
    <input class="budget-input" id="budgetInput" type="number" min="0" placeholder="5000">
    <button class="set-btn" onclick="setBudget()">設定</button>
  </div>
</div>

<!-- 支出入力 -->
<div class="section-card">
  <div class="section-title">支出を追加</div>
  <div class="expense-row">
    <span class="yen-symbol" style="align-self:center">¥</span>
    <input class="expense-input" id="amountInput" type="number" min="0" placeholder="500">
    <button class="add-btn" onclick="addExpense()">+</button>
  </div>
  <div class="expense-row" style="margin-bottom:0">
    <input class="note-input" id="noteInput" type="text" placeholder="メモ（例：コンビニ）" maxlength="20">
  </div>
</div>

<!-- 履歴 -->
<div class="section-card">
  <div class="section-title">今日の履歴</div>
  <ul class="history-list" id="historyList">
    <li class="empty-history">まだ支出がありません</li>
  </ul>
</div>

<script>
const CIRCUMFERENCE = 2 * Math.PI * 80; // ~502.65
const ringFill = document.getElementById('ringFill');
ringFill.setAttribute('stroke-dasharray', CIRCUMFERENCE);
ringFill.setAttribute('stroke-dashoffset', CIRCUMFERENCE);

let budget = parseInt(localStorage.getItem('daily_budget') || '0');
let expenses = JSON.parse(localStorage.getItem('daily_expenses') || '[]');

// 日付リセット
const today = new Date().toLocaleDateString('ja-JP', {year:'numeric',month:'long',day:'numeric'});
const savedDate = localStorage.getItem('expense_date');
if (savedDate !== today) {
  expenses = [];
  localStorage.setItem('expense_date', today);
  localStorage.setItem('daily_expenses', '[]');
}

document.getElementById('dateLabel').textContent = today;

function fmt(n) {
  return n.toLocaleString('ja-JP');
}

function update() {
  const spent = expenses.reduce((s, e) => s + e.amount, 0);
  const remaining = budget - spent;
  const ratio = budget > 0 ? Math.max(0, remaining / budget) : 1;

  // リング
  const offset = CIRCUMFERENCE * (1 - ratio);
  ringFill.setAttribute('stroke-dashoffset', offset);

  let color;
  if (ratio > 0.5)      color = '#00E5A0';
  else if (ratio > 0.2) color = '#FFD166';
  else                  color = '#FF3B5C';
  ringFill.setAttribute('stroke', color);

  // 残額
  const remEl = document.getElementById('remaining');
  remEl.textContent = budget > 0 ? fmt(Math.abs(remaining)) : '—';
  remEl.style.color = remaining < 0 ? '#FF3B5C' : color;

  document.getElementById('budgetDisp').innerHTML = budget > 0
    ? `${fmt(budget)}<span class="stat-unit"> 円</span>`
    : `—<span class="stat-unit"> 円</span>`;

  document.getElementById('spentDisp').innerHTML =
    `${fmt(spent)}<span class="stat-unit"> 円</span>`;

  document.getElementById('overNotice').style.display =
    (budget > 0 && remaining < 0) ? 'block' : 'none';

  // 履歴
  const list = document.getElementById('historyList');
  if (expenses.length === 0) {
    list.innerHTML = '<li class="empty-history">まだ支出がありません</li>';
  } else {
    list.innerHTML = [...expenses].reverse().map((e, ri) => {
      const i = expenses.length - 1 - ri;
      return `
        <li class="history-item">
          <span class="history-note">${e.note || '—'}</span>
          <span class="history-amount">${fmt(e.amount)} 円</span>
          <button class="del-btn" onclick="deleteExpense(${i})">✕</button>
        </li>`;
    }).join('');
  }

  localStorage.setItem('daily_expenses', JSON.stringify(expenses));
}

function setBudget() {
  const val = parseInt(document.getElementById('budgetInput').value);
  if (isNaN(val) || val <= 0) return;
  budget = val;
  localStorage.setItem('daily_budget', budget);
  document.getElementById('budgetInput').value = '';
  update();
}

function addExpense() {
  const amt = parseInt(document.getElementById('amountInput').value);
  const note = document.getElementById('noteInput').value.trim();
  if (isNaN(amt) || amt <= 0) return;
  expenses.push({ amount: amt, note });
  document.getElementById('amountInput').value = '';
  document.getElementById('noteInput').value = '';
  update();
}

function deleteExpense(i) {
  expenses.splice(i, 1);
  update();
}

// Enterキー対応
document.getElementById('budgetInput').addEventListener('keydown', e => { if (e.key === 'Enter') setBudget(); });
document.getElementById('amountInput').addEventListener('keydown', e => { if (e.key === 'Enter') addExpense(); });
document.getElementById('noteInput').addEventListener('keydown', e => { if (e.key === 'Enter') addExpense(); });

// 既存の予算をinputに表示
if (budget > 0) document.getElementById('budgetInput').placeholder = fmt(budget);

update();
</script>
</body>
</html>
